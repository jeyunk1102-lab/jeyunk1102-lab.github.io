<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy as Pie | Recipe Megazine</title>
    <style>
        :root {
            --bg-color: #FAF9F5;
            --card-bg: #FFFFFF;
            --text-main: #2B2D42;
            --text-sub: #5C677D;
            --accent-color: #2E7D32;
            --badge-bg: #E8F5E9;
            --border-color: #EAEAEA;
            --tip-bg: #FFF9E6;
            --tip-border: #FFB703;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 50px 20px;
            line-height: 1.65;
        }

        .container {
            max-width: 840px;
            margin: 0 auto;
        }

        /* Header */
        header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 25px;
            border-bottom: 2px solid #E5E5E5;
        }

        .site-title {
            font-size: 2.4rem;
            font-weight: 700;
            margin: 0 0 10px 0;
            letter-spacing: -0.5px;
        }

        .site-subtitle {
            color: var(--text-sub);
            font-size: 1.05rem;
            margin: 0;
        }

        /* Filter Tabs */
        .filter-nav {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 40px;
        }

        .filter-btn {
            background-color: #FFFFFF;
            border: 1px solid var(--border-color);
            color: var(--text-sub);
            padding: 8px 18px;
            border-radius: 25px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .filter-btn:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        .filter-btn.active {
            background-color: var(--accent-color);
            color: #FFFFFF;
            border-color: var(--accent-color);
        }

        /* Recipe Grid (Menu List View) */
        .recipe-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .recipe-item-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .recipe-item-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
            border-color: var(--accent-color);
        }

        .recipe-item-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin: 10px 0;
            color: var(--text-main);
        }

        .recipe-item-desc {
            font-size: 0.9rem;
            color: var(--text-sub);
            line-height: 1.4;
        }

        /* Image Styles for Card & Modal */
        .card-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .modal-img {
            width: 100%;
            max-height: 480px;
            object-fit: cover;
            background-color: #F3F3EF;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        /* Detail Modal Overlay */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: var(--card-bg);
            border-radius: 16px;
            max-width: 700px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 36px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            animation: fadeIn 0.25s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 24px;
            font-size: 1.8rem;
            font-weight: 300;
            color: var(--text-sub);
            cursor: pointer;
            background: none;
            border: none;
            line-height: 1;
        }

        .close-btn:hover {
            color: var(--text-main);
        }

        /* Recipe Article inside Modal */
        .badge {
            display: inline-block;
            background-color: var(--badge-bg);
            color: var(--accent-color);
            font-size: 0.8rem;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .recipe-title {
            font-size: 1.7rem;
            margin: 0 0 10px 0;
            letter-spacing: -0.3px;
        }

        .recipe-quote {
            color: var(--text-sub);
            font-size: 1.02rem;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px dashed var(--border-color);
        }

        h3.section-subtitle {
            font-size: 1.15rem;
            font-weight: 700;
            border-bottom: 2px solid var(--text-main);
            padding-bottom: 6px;
            margin-top: 32px;
            margin-bottom: 14px;
        }

        ul {
            padding-left: 20px;
            margin-bottom: 20px;
        }

        li {
            margin-bottom: 10px;
        }

        .pro-tip {
            background-color: var(--tip-bg);
            border-left: 4px solid var(--tip-border);
            padding: 16px 20px;
            border-radius: 0 8px 8px 0;
            font-size: 0.95rem;
            margin-top: 28px;
        }

        footer {
            text-align: center;
            color: var(--text-sub);
            font-size: 0.9rem;
            margin-top: 60px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <header>
            <h1 class="site-title">Easy as Pie</h1>
            <p class="site-subtitle">Simple, detailed, and fail-proof healthy recipes for every beginner</p>
        </header>

        <!-- Category Filter Buttons -->
        <nav class="filter-nav">
            <button class="filter-btn active" onclick="filterRecipes('all')">All</button>
            <button class="filter-btn" onclick="filterRecipes('breakfast')">Breakfast</button>
            <button class="filter-btn" onclick="filterRecipes('main')">Main Dish</button>
            <button class="filter-btn" onclick="filterRecipes('noodles')">Noodles & Pasta</button>
            <button class="filter-btn" onclick="filterRecipes('soups')">Soups</button>
            <button class="filter-btn" onclick="filterRecipes('snacks')">Snacks & Sides</button>
            <button class="filter-btn" onclick="filterRecipes('desserts')">Desserts</button>
        </nav>

        <!-- Recipe Cards Grid -->
        <div class="recipe-grid" id="recipe-grid">
            <!-- Items rendered via JavaScript -->
        </div>

        <!-- Footer -->
        <footer>
            <p>&copy; 2026 Jeyun. All rights reserved. Excerpt from the upcoming recipe book &lt;Easy as Pie&gt;.</p>
        </footer>
    </div>

    <!-- Recipe Detail Modal -->
    <div class="modal-overlay" id="recipe-modal" onclick="closeModalOnOverlay(event)">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">&times;</button>
            <div id="modal-body">
                <!-- Recipe details injected here -->
            </div>
        </div>
    </div>

                    '<strong>Step 2 (Aromatics):</strong> Add diced onion and sauté until sweet and fragrant, then toss in garlic and stir-fry for another 30 seconds.',
                    '<strong>Step 3 (Deglaze & Simmer):</strong> Mix in 1/2 tsp soy sauce, add 50–70ml water, and simmer for 3–5 minutes.',
                    '<strong>Step 4 (Dairy & Serve):</strong> Turn heat to low, add 200ml milk and 1.5 cheese slices. Gently warm through without letting it boil. Season generously with black pepper and serve.'
                ],
                tip: '<strong>Pro Tip (Velvety Texture):</strong> Using a veggie chopper to ultra-fine dice the onions creates a much smoother, velvety soup texture! Remember to gently heat the milk and cheese rather than boiling.'
            }
        ];

        function renderRecipes(category = 'all') {
            const grid = document.getElementById('recipe-grid');
            grid.innerHTML = '';

            const filtered = category === 'all' 
                ? recipes 
                : recipes.filter(r => r.category === category);

            filtered.forEach(recipe => {
                const card = document.createElement('div');
                card.className = 'recipe-item-card';
                card.onclick = () => openModal(recipe.id);

                // 이미지가 있으면 태그 생성, 없으면 빈 문자열
                const imgTag = recipe.image ? `<img src="${recipe.image}" alt="${recipe.title}" class="card-img">` : '';

                card.innerHTML = `
                    <div>
                        ${imgTag}
                        <span class="badge">${recipe.badge}</span>
                        <h3 class="recipe-item-title">${recipe.title}</h3>
                        <p class="recipe-item-desc">${recipe.quote}</p>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterRecipes(category) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderRecipes(category);
        }

        function openModal(id) {
            const recipe = recipes.find(r => r.id === id);
            if (!recipe) return;

            const modalBody = document.getElementById('modal-body');
            const imgTag = recipe.image ? `<img src="${recipe.image}" alt="${recipe.title}" class="modal-img">` : '';

            modalBody.innerHTML = `
                ${imgTag}
                <span class="badge">${recipe.badge}</span>
                <h2 class="recipe-title">${recipe.title}</h2>
                <div class="recipe-quote">${recipe.quote}</div>

                <h3 class="section-subtitle">Ingredients</h3>
                <ul>
                    ${recipe.ingredients.map(i => `<li>${i}</li>`).join('')}
                </ul>

                <h3 class="section-subtitle">Instructions</h3>
                <ul>
                    ${recipe.instructions.map(i => `<li>${i}</li>`).join('')}
                </ul>

                <div class="pro-tip">
                    ${recipe.tip}
                </div>
            `;

            document.getElementById('recipe-modal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('recipe-modal').classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        function closeModalOnOverlay(e) {
            if (e.target.id === 'recipe-modal') {
                closeModal();
            }
        }

        // Initial Render
        renderRecipes('all');
    </script>
</body>
</html>
